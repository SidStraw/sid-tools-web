packages:
  - apps/*
  - packages/*
catalog:
  parse5: 8.0.1
  css-tree: 3.2.1
  '@types/css-tree': 3.2.0
  vite-plus: 1.0.0
  typescript: 7.0.2
  '@types/node': 24.19.1
  semver: 7.7.3
  '@types/semver': 7.7.1
saveExact: true
pmOnFail: error
runtimeOnFail: error
engineStrict: true
minimumReleaseAge: 4320
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  esbuild: true
  workerd: true
  '@google/genai': false
  protobufjs: false
peerDependencyRules:
  allowedVersions:
    vitest@5.0.1>vite: 1.0.0
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0
  vitest@*: 5.0.1
